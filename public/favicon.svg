<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark background with rounded corners -->
  <rect width="512" height="512" fill="#0a0a0a" rx="80"/>

  <!-- Brain/neural icon -->
  <g fill="#3b82f6" opacity="0.95">
    <!-- Left hemisphere -->
    <path d="M 180 160 Q 140 160 120 200 Q 100 240 120 280 Q 130 300 150 310 L 180 320 Q 200 280 180 240 Q 170 210 180 180 Z" opacity="0.9"/>

    <!-- Right hemisphere -->
    <path d="M 332 160 Q 372 160 392 200 Q 412 240 392 280 Q 382 300 362 310 L 332 320 Q 312 280 332 240 Q 342 210 332 180 Z" opacity="0.9"/>

    <!-- Center connection -->
    <ellipse cx="256" cy="250" rx="50" ry="80" opacity="0.8"/>

    <!-- Neural pathways -->
    <circle cx="200" cy="200" r="12" opacity="0.95"/>
    <circle cx="312" cy="200" r="12" opacity="0.95"/>
    <circle cx="256" cy="180" r="10" opacity="0.9"/>
    <circle cx="220" cy="260" r="10" opacity="0.9"/>
    <circle cx="292" cy="260" r="10" opacity="0.9"/>
    <circle cx="256" cy="300" r="12" opacity="0.95"/>

    <!-- Connection lines -->
    <line x1="200" y1="200" x2="256" y2="180" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    <line x1="312" y1="200" x2="256" y2="180" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    <line x1="220" y1="260" x2="256" y2="300" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    <line x1="292" y1="260" x2="256" y2="300" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  </g>
</svg>
