<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0a0a0a" rx="80"/>

  <!-- Neural network nodes -->
  <!-- Input layer -->
  <circle cx="120" cy="180" r="16" fill="#3b82f6" opacity="0.8"/>
  <circle cx="120" cy="256" r="16" fill="#3b82f6" opacity="0.8"/>
  <circle cx="120" cy="332" r="16" fill="#3b82f6" opacity="0.8"/>

  <!-- Hidden layer 1 -->
  <circle cx="230" cy="140" r="16" fill="#3b82f6" opacity="0.9"/>
  <circle cx="230" cy="220" r="16" fill="#3b82f6" opacity="0.9"/>
  <circle cx="230" cy="292" r="16" fill="#3b82f6" opacity="0.9"/>
  <circle cx="230" cy="372" r="16" fill="#3b82f6" opacity="0.9"/>

  <!-- Hidden layer 2 -->
  <circle cx="340" cy="180" r="16" fill="#3b82f6" opacity="0.9"/>
  <circle cx="340" cy="256" r="16" fill="#3b82f6" opacity="0.9"/>
  <circle cx="340" cy="332" r="16" fill="#3b82f6" opacity="0.9"/>

  <!-- Output layer -->
  <circle cx="450" cy="220" r="16" fill="#3b82f6"/>
  <circle cx="450" cy="292" r="16" fill="#3b82f6"/>

  <!-- Connections (input to hidden1) -->
  <line x1="136" y1="180" x2="214" y2="140" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
  <line x1="136" y1="180" x2="214" y2="220" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
  <line x1="136" y1="256" x2="214" y2="220" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
  <line x1="136" y1="256" x2="214" y2="292" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
  <line x1="136" y1="332" x2="214" y2="292" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
  <line x1="136" y1="332" x2="214" y2="372" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>

  <!-- Connections (hidden1 to hidden2) -->
  <line x1="246" y1="140" x2="324" y2="180" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
  <line x1="246" y1="220" x2="324" y2="180" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  <line x1="246" y1="220" x2="324" y2="256" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  <line x1="246" y1="292" x2="324" y2="256" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  <line x1="246" y1="292" x2="324" y2="332" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  <line x1="246" y1="372" x2="324" y2="332" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>

  <!-- Connections (hidden2 to output) -->
  <line x1="356" y1="180" x2="434" y2="220" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  <line x1="356" y1="256" x2="434" y2="220" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <line x1="356" y1="256" x2="434" y2="292" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <line x1="356" y1="332" x2="434" y2="292" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
</svg>
